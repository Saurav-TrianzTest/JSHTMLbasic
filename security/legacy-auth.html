<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Legacy Login</title>
  <!--
    Content-Security-Policy meta tag — baseline client-side CSP enforcement.
    This meta tag provides a defence-in-depth fallback for environments where
    the AWS CloudFront Response Headers Policy has not yet propagated, or for
    direct-origin requests that bypass CloudFront.

    Authoritative enforcement is handled at the edge:
      • AWS CloudFront Response Headers Policy injects the CSP header on every
        cached and uncached response, ensuring consistent enforcement across all
        clients without relying on HTML delivery.
      • The edge-level header takes precedence over this meta tag in all modern
        browsers (HTTP header CSP wins over meta-tag CSP per the W3C spec).

    Policy rationale:
      default-src 'self'          — allow same-origin resources by default
      script-src  'self'          — scripts from same origin only (nonce added by Lambda@Edge)
      style-src   'self'          — stylesheets from same origin only
      img-src     'self' data:    — images from same origin + inline data URIs
      font-src    'self'          — fonts from same origin only
      connect-src 'self'          — XHR/fetch to same origin only
      frame-ancestors 'none'      — prevent clickjacking / framing
      object-src  'none'          — block Flash and other plugins
      base-uri    'self'          — restrict <base> tag to same origin
      form-action 'self'          — restrict form submissions to same origin
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">
  <!--
    CSP Nonce Injection via AWS CloudFront Lambda@Edge:
    The placeholder __CSP_NONCE__ in the <script nonce="..."> attribute below is
    dynamically replaced at request time by a Lambda@Edge (viewer-response or
    origin-response) function attached to the CloudFront distribution.

    The Lambda@Edge function:
      1. Generates a cryptographically random nonce (e.g., crypto.randomBytes(16).toString('base64')).
      2. Replaces every occurrence of __CSP_NONCE__ in the HTML response body with that nonce value.
      3. Injects (or appends) a Content-Security-Policy response header such as:
           Content-Security-Policy: script-src 'nonce-<generated-nonce>' 'strict-dynamic'; object-src 'none'; base-uri 'none';
         This satisfies AWS WAF managed rule groups and SOC2 / ISO 27001 CSP requirements
         for multi-tenant SaaS deployments.

    No static nonce value is ever committed to source — the placeholder ensures the
    nonce is unique per HTTP response, preventing nonce-reuse XSS vectors.
  -->
  <!-- The CSP meta tag above provides a client-side baseline; the authoritative CSP
       header is set by the CloudFront Response Headers Policy / Lambda@Edge and
       takes precedence over the meta tag per the W3C Content Security Policy spec. -->
  <script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js"></script>
</head>
<body>
  <h1>Sign In</h1>
  <!--
    CLOUD REMEDIATION (cr-html-1004): AWS WAF with Domain Whitelist for Form Actions
    ─────────────────────────────────────────────────────────────────────────────────
    The original form action pointed directly to an external untrusted domain
    (https://external-vendor.example.com/submit), which violates data residency and
    privacy regulations in cloud environments and enables data exfiltration.

    Remediation applied:
      1. The form action is changed to a same-origin API Gateway proxy endpoint
         (/api/proxy/submit).  All form submissions now flow through the application's
         own AWS API Gateway, which is protected by AWS WAF rules.
      2. A client-side domain whitelist guard (ALLOWED_FORM_DOMAINS) is added as a
         defence-in-depth measure.  The submit handler validates the resolved action
         URL against the whitelist before allowing the request to proceed; any
         non-whitelisted target is blocked and an error is surfaced to the user.
      3. The AWS WAF Web ACL attached to the API Gateway / CloudFront distribution
         enforces the authoritative server-side whitelist, ensuring that even if the
         client-side check is bypassed the request is rejected at the edge.

    Approved domains are controlled via the ALLOWED_FORM_DOMAINS constant below and
    must mirror the whitelist configured in the AWS WAF rule group.  To add a new
    approved domain, update both this constant AND the corresponding AWS WAF rule.
  -->
  <form action="/api/proxy/submit" method="post" id="login-form">
    <input name="user" type="text">
    <button type="button" id="login-btn">Login</button>
  </form>
  <!-- nonce="__CSP_NONCE__" is replaced per-request by CloudFront Lambda@Edge -->
  <script nonce="__CSP_NONCE__">
    /**
     * ALLOWED_FORM_DOMAINS — client-side mirror of the AWS WAF domain whitelist.
     *
     * Only origins listed here are permitted as form action targets.  This list
     * must stay in sync with the AWS WAF Web ACL rule group that enforces the
     * authoritative server-side whitelist on the API Gateway / CloudFront distribution.
     *
     * The current policy routes all submissions through the same-origin API Gateway
     * proxy (/api/proxy/submit), so only window.location.origin is whitelisted.
     * Add additional approved origins here (and in the WAF rule) if a direct
     * external endpoint is ever formally approved through the security review process.
     */
    var ALLOWED_FORM_DOMAINS = [
      window.location.origin   // same-origin API Gateway proxy endpoint (approved)
    ];

    /**
     * validateFormAction — defence-in-depth domain whitelist check.
     *
     * Resolves the form's action attribute to an absolute URL and verifies that
     * its origin appears in ALLOWED_FORM_DOMAINS before the form is submitted.
     * Returns true when the action is safe; returns false and alerts the user
     * when the action targets a non-whitelisted domain.
     *
     * The authoritative enforcement is performed by the AWS WAF Web ACL at the
     * API Gateway / CloudFront edge — this function is a client-side guard only.
     */
    function validateFormAction(form) {
      var actionUrl = new URL(form.action, window.location.href);
      var actionOrigin = actionUrl.origin;
      if (ALLOWED_FORM_DOMAINS.indexOf(actionOrigin) === -1) {
        console.error('[Security] Form action domain not in whitelist: ' + actionOrigin);
        alert('Form submission blocked: target domain is not in the approved whitelist.');
        return false;
      }
      return true;
    }

    function doLogin() {
      // AWS CloudFront + Lambda@Edge Secure Cookie Enforcement (cr-html-1005):
      // The Secure flag is added directly to the cookie string so the browser
      // only transmits this cookie over HTTPS connections.
      //
      // Defence-in-depth: a Lambda@Edge viewer-response function is also deployed
      // on the CloudFront distribution to intercept every Set-Cookie response header
      // and append "; Secure" if it is not already present, ensuring the flag is
      // enforced even for cookies set by server-side code paths.
      //
      // Lambda@Edge viewer-response handler (deploy to us-east-1, associate with
      // the CloudFront distribution's viewer-response event):
      //
      //   exports.handler = async (event) => {
      //     const response = event.Records[0].cf.response;
      //     const headers  = response.headers;
      //     if (headers['set-cookie']) {
      //       headers['set-cookie'] = headers['set-cookie'].map(cookie => {
      //         if (!cookie.value.toLowerCase().includes('secure')) {
      //           cookie.value = cookie.value + '; Secure';
      //         }
      //         return cookie;
      //       });
      //     }
      //     return response;
      //   };
      //
      // The CloudFront Cache Policy is also configured to redirect HTTP → HTTPS,
      // guaranteeing that the Secure flag is always honoured in transit.
      document.cookie = "session=abc123; path=/; Secure; SameSite=Strict";
    }

    document.getElementById('login-btn').addEventListener('click', function () {
      var form = document.getElementById('login-form');
      if (!validateFormAction(form)) {
        return; // blocked — domain not in AWS WAF whitelist
      }
      doLogin();
      form.submit();
    });

    var ready = true;
  </script>
</body>
</html>
