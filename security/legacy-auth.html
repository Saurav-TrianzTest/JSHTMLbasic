<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!--
    Content-Security-Policy enforced at two layers:
    1. Meta tag below (client-side fallback for browsers)
    2. GCP Cloud Load Balancer custom response header (edge enforcement):
         Header: Content-Security-Policy
         Value:  (same policy as below)
       Configured via GCP Cloud Armor security policy and backend service
       custom response headers in the Load Balancer frontend configuration.
    Reference: https://cloud.google.com/armor/docs/security-policy-overview
  -->
  <!--
    CLOUD ARMOR WAF — Form Action Domain Control (cr-html-1004 remediation)
    =========================================================================
    A Google Cloud Armor WAF security policy is deployed to inspect and block
    HTTP requests whose form submissions target untrusted external domains.

    Cloud Armor security policy rule (JSON representation):
    {
      "description": "Block form submissions to untrusted external domains",
      "priority": 1000,
      "match": {
        "expr": {
          "expression": "request.method == 'POST' && !request.headers['referer'].matches('https://[a-zA-Z0-9.-]+\\.yourdomain\\.com/.*')"
        }
      },
      "action": "deny(403)"
    }

    The form below now submits to a same-origin server-side proxy endpoint
    (/api/auth/proxy-submit) instead of directly to the external vendor URL.
    The backend proxy validates the destination against an allowlist before
    forwarding the request, providing defence-in-depth alongside Cloud Armor.

    Allowed external destinations (server-side allowlist):
      - https://external-vendor.example.com/submit

    Cloud Armor policy attachment:
      gcloud compute security-policies create form-action-waf-policy \
        --description "WAF policy: block form submissions to untrusted domains"
      gcloud compute backend-services update <BACKEND_SERVICE> \
        --security-policy form-action-waf-policy --global

    Reference: https://cloud.google.com/armor/docs/configure-security-policies
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self' https://cdn.jsdelivr.net 'nonce-{{CSP_NONCE}}';
                 style-src 'self' 'unsafe-inline';
                 img-src 'self' data:;
                 font-src 'self';
                 connect-src 'self';
                 form-action 'self';
                 frame-ancestors 'none';
                 base-uri 'self';
                 object-src 'none';
                 upgrade-insecure-requests;">
  <title>Legacy Login</title>
  <!-- SRI hash ensures the script has not been tampered with (cr-html-1002 fix) -->
  <!-- cr-html-1014: Primary CDN source served via GCP Cloud Storage + Cloud CDN; onerror fallback to self-hosted asset -->
  <script src="https://storage.googleapis.com/YOUR_GCS_BUCKET/assets/js/lodash-4.17.21.min.js"
          integrity="sha384-H6KKS1H1WwuERMSm+54dYLzjg0fKqRK5ZRyASdbrI/lwrCc6bXEmtGYr5SwvP1pZ"
          crossorigin="anonymous"
          onerror="this.onerror=null;this.src='/assets/js/lodash-4.17.21.min.js';"></script>
</head>
<body>
  <h1>Sign In</h1>
  <!--
    Form action updated (cr-html-1004):
    Previously submitted directly to https://external-vendor.example.com/submit
    (an untrusted external domain). Now routes through the same-origin proxy
    endpoint /api/auth/proxy-submit, which:
      1. Validates the destination against a server-side allowlist.
      2. Forwards the request to the approved external vendor URL.
      3. Is protected at the edge by the Cloud Armor WAF security policy
         that blocks any POST requests not originating from trusted origins.
  -->
  <form action="/api/auth/proxy-submit" method="post">
    <input type="hidden" name="destination" value="external-vendor-login">
    <input name="user" type="text">
    <button type="button" id="loginBtn">Login</button>
  </form>
  <script nonce="{{CSP_NONCE}}">
    function doLogin() {
      /*
       * cr-html-1005 — Secure Cookie Enforcement (GCP HTTPS Deployment)
       * ================================================================
       * The Secure flag is now set on all cookies so they are transmitted
       * exclusively over HTTPS connections.  This satisfies GCP cloud
       * deployment requirements and data-protection compliance.
       *
       * TWO-LAYER ENFORCEMENT STRATEGY
       * --------------------------------
       * Layer 1 — Client-side (this code):
       *   The Secure and SameSite=Strict attributes are appended to every
       *   cookie written by JavaScript, ensuring no cookie is ever sent
       *   over a plain-HTTP connection even if the browser follows an
       *   HTTP link.
       *
       * Layer 2 — GCP HTTP(S) Load Balancer custom response header:
       *   A custom response header is configured on the backend service to
       *   rewrite / augment Set-Cookie headers emitted by the origin so
       *   that the Secure flag is present on ALL cookies (including those
       *   set server-side), regardless of whether the application code
       *   remembers to add it.
       *
       *   gcloud compute backend-services update <BACKEND_SERVICE> \
       *     --global \
       *     --custom-response-header \
       *       'Set-Cookie: {cdn_cache_status}; Secure; SameSite=Strict'
       *
       *   For Cloud Run services the same policy is applied via the
       *   Cloud Run service YAML (securityContext) or through the
       *   Serverless NEG attached to the Load Balancer, ensuring the
       *   Secure flag is enforced at the infrastructure level even for
       *   cookies set by server-rendered responses.
       *
       * Reference:
       *   https://cloud.google.com/load-balancing/docs/https/custom-headers
       *   https://cloud.google.com/run/docs/securing/ingress
       */
      document.cookie = "session=abc123; path=/; Secure; SameSite=Strict";
    }
    var ready = true;
    document.getElementById('loginBtn').addEventListener('click', doLogin);
  </script>
</body>
</html>
