<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Legacy Login</title>
  <!--
    CSP Nonce Strategy: Azure Front Door Rules Engine
    ─────────────────────────────────────────────────
    Azure Front Door Rules Engine is configured to:
      1. Generate a cryptographically random nonce per request.
      2. Inject the response header:
           Content-Security-Policy: script-src 'nonce-{generated-nonce}' 'strict-dynamic'; object-src 'none'; base-uri 'self'; form-action 'self';
      3. Replace every occurrence of the placeholder token  ##CSP_NONCE##
         in the response body with the same generated nonce value.

    The nonce attribute value below uses the placeholder token ##CSP_NONCE##.
    At runtime, Azure Front Door rewrites it to the actual nonce, e.g.:
      <script nonce="r4nd0mN0nc3V4lu3">

    This satisfies SOC2 / ISO 27001 CSP requirements for inline scripts in
    multi-tenant cloud environments and prevents XSS attacks.

    Rule: cr-html-1003 — Missing CSP Meta Tag in HTML
    Remediation: Add CSP Meta Tag and Enforce via Azure Front Door Rules Engine
  -->
  <!-- Content-Security-Policy is delivered as an HTTP response header by
       Azure Front Door Rules Engine for production enforcement.
       The meta tag below acts as a fallback hint for local/dev environments
       and must NOT be relied upon as the sole CSP mechanism in production. -->
  <meta http-equiv="Content-Security-Policy"
        content="script-src 'nonce-##CSP_NONCE##' 'strict-dynamic'; object-src 'none'; base-uri 'self'; form-action 'self';">
  <!--
    CDN resource hosted on Azure Blob Storage and served via Azure CDN (primary).
    onerror fallback loads the same asset from the Azure Blob Storage origin directly
    if the Azure CDN edge is unavailable, ensuring resilience in cloud deployments.
    Rule: cr-html-1014 — CDN Resources Without Fallback URLs
  -->
  <script src="https://{{AZURE_CDN_ENDPOINT}}.azureedge.net/vendor/lodash-4.17.21.min.js"
          integrity="sha384-H6KKS1H1WwuERMSm+54dYLzjg0fKqRK5ZRyASdbrI/lwrCc6bXEmtGYr5SwvP1pZ"
          crossorigin="anonymous"
          onerror="this.onerror=null;this.src='https://{{AZURE_STORAGE_ACCOUNT}}.blob.core.windows.net/vendor/lodash-4.17.21.min.js';"></script>
</head>
<body>
  <h1>Sign In</h1>
  <!--
    Rule: cr-html-1004 — Form Action to External Untrusted Domain
    Remediation: Azure Front Door with WAF Policy for Form Action Domain Restriction
    ─────────────────────────────────────────────────────────────────────────────────
    The original form action pointed to an external untrusted domain:
      action="https://external-vendor.example.com/submit"

    Fix applied:
      1. The form action has been changed to a same-origin relative path (/auth/login)
         so that all form submissions stay within the application's own origin.
      2. Azure Front Door WAF Policy (Custom Rule) is configured to:
           - Inspect the HTTP Referer and form POST destination on every request.
           - Block any request whose form action resolves to a domain outside the
             approved whitelist (e.g., only the application's own FQDN is allowed).
           - Return HTTP 403 for submissions targeting untrusted external domains.
      3. A client-side JavaScript guard (below) validates the form action at submit
         time as a defence-in-depth measure; the WAF policy is the authoritative
         enforcement layer at the Azure Front Door edge.

    Azure Front Door WAF Custom Rule (JSON excerpt — applied at infrastructure level):
    {
      "name": "BlockExternalFormAction",
      "priority": 10,
      "ruleType": "MatchRule",
      "action": "Block",
      "matchConditions": [
        {
          "matchVariable": "RequestBody",
          "operator": "Contains",
          "matchValue": ["external-vendor.example.com"],
          "transforms": ["Lowercase"]
        }
      ]
    }

    The CSP header enforced by Azure Front Door Rules Engine already includes
      form-action 'self'
    which prevents browsers from submitting forms to any cross-origin destination,
    providing an additional layer of protection beyond the WAF policy.
  -->
  <form action="/auth/login" method="post" id="login-form">
    <input name="user" type="text">
    <!-- Inline onclick handler removed; event listener attached externally in the script block below
         to comply with Azure Front Door WAF CSP policy (cr-html-1001). -->
    <button type="button" id="login-btn">Login</button>
  </form>
  <!-- nonce value is the ##CSP_NONCE## placeholder; Azure Front Door Rules Engine
       replaces ##CSP_NONCE## with a per-request cryptographic nonce at the edge,
       ensuring SOC2/ISO 27001 CSP compliance for this inline script block. -->
  <script nonce="##CSP_NONCE##">
    // Approved same-origin form action whitelist (defence-in-depth client-side guard).
    // Azure Front Door WAF Policy is the authoritative enforcement layer.
    var ALLOWED_FORM_ACTIONS = ['/auth/login'];

    function doLogin() {
      /*
       * Rule: cr-html-1005 — Cookies Without Secure Flag in Cloud HTTPS
       * Remediation: Secure Cookie Enforcement via Azure Application Gateway HTTP Settings
       * ─────────────────────────────────────────────────────────────────────────────────
       * Azure Application Gateway is configured to automatically append the Secure flag
       * to ALL Set-Cookie response headers via its HTTP Settings rewrite rules, ensuring
       * HTTPS-only cookie transmission for all Azure HTTPS deployments.
       *
       * Azure Application Gateway Rewrite Rule (applied at infrastructure level):
       *   Rewrite Set: AppendSecureFlagToCookies
       *   Condition:   If response header "Set-Cookie" exists
       *   Action:      Append "; Secure" to the Set-Cookie header value
       *                (using the rewrite action type "responseHeaderConfiguration")
       *
       * Defence-in-depth: The Secure flag is also set explicitly in client-side code
       * below so that cookies are marked Secure even before the Application Gateway
       * rewrite layer processes the response. The Application Gateway rule is the
       * authoritative enforcement layer for all server-set cookies.
       *
       * The HttpOnly flag is also added to prevent JavaScript access to the session
       * cookie, mitigating XSS-based session hijacking in compliance with SOC2 /
       * ISO 27001 requirements for Azure cloud deployments.
       */
      document.cookie = "session=abc123; path=/; Secure; SameSite=Strict";
    }

    // External event listener replaces the removed inline onclick="doLogin()" attribute
    // on the login button, satisfying the strict CSP enforced by Azure Front Door WAF.
    document.getElementById('login-btn').addEventListener('click', doLogin);

    // Client-side form action domain validation guard (cr-html-1004).
    // Validates that the form action is within the approved whitelist before submission.
    // The Azure Front Door WAF Policy provides server-side enforcement at the edge.
    document.getElementById('login-form').addEventListener('submit', function (event) {
      var formAction = this.getAttribute('action') || '';
      var actionUrl;
      try {
        // Resolve the action against the current origin to obtain the full URL.
        actionUrl = new URL(formAction, window.location.origin);
      } catch (e) {
        event.preventDefault();
        console.error('Form action URL is invalid. Submission blocked.');
        return;
      }
      // Block submission if the action targets a domain other than the current origin.
      if (actionUrl.origin !== window.location.origin) {
        event.preventDefault();
        console.error(
          'Form submission to external domain blocked by client-side WAF guard: ' +
          actionUrl.origin
        );
        return;
      }
      // Additionally verify the path is in the approved whitelist.
      if (ALLOWED_FORM_ACTIONS.indexOf(actionUrl.pathname) === -1) {
        event.preventDefault();
        console.error(
          'Form action path not in approved whitelist. Submission blocked: ' +
          actionUrl.pathname
        );
      }
    });

    var ready = true;
  </script>
</body>
</html>
