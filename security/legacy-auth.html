<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Legacy Login</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://#{CLOUDFRONT_DISTRIBUTION_DOMAIN} https://#{S3_BUCKET_NAME}.s3.amazonaws.com 'nonce-__CSP_NONCE__' 'strict-dynamic'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self' https://external-vendor.example.com;">
  <!--
    CSP Nonce Strategy: AWS CloudFront Lambda@Edge
    A Lambda@Edge function (viewer-response trigger) generates a cryptographically
    random nonce per request and:
      1. Replaces the placeholder token __CSP_NONCE__ in this HTML with the actual nonce value.
      2. Injects the Content-Security-Policy response header:
           Content-Security-Policy: default-src 'self'; script-src 'nonce-<generated-nonce>' 'strict-dynamic'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self' https://external-vendor.example.com;
    This satisfies AWS WAF managed rules and SOC2/ISO 27001 CSP requirements for
    multi-tenant cloud SaaS environments.

    AWS CloudFront Response Headers Policy enforcement:
    - Create a CloudFront Response Headers Policy with the Content-Security-Policy header above.
    - Attach the policy to the CloudFront distribution behavior serving this HTML.
    - The CloudFront-level header takes precedence and provides centralized, consistent enforcement
      across all edge locations, complementing the meta tag below.
  -->
  <!-- CSP meta tag for browser-level enforcement (defense-in-depth alongside CloudFront Response Headers Policy) -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'nonce-__CSP_NONCE__' 'strict-dynamic'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self' https://external-vendor.example.com;">
  <!-- SRI hash for lodash@4.17.21 (pinned version) served via jsDelivr CDN with AWS CloudFront origin validation -->
  <!--
    CDN Fallback Strategy: AWS S3 + CloudFront (cr-html-1014)
    ──────────────────────────────────────────────────────────
    Primary:  AWS CloudFront distribution serving lodash.min.js from S3 origin.
    Fallback: Direct S3 origin URL if CloudFront is unavailable.
    The inline script below detects CDN load failure (_ not defined) and
    falls back to the S3 origin.

    Setup required:
    1. Upload lodash.min.js to S3:
         s3://#{S3_BUCKET_NAME}/assets/js/lodash-4.17.21.min.js
    2. Create a CloudFront distribution with the S3 bucket as origin.
    3. Replace #{CLOUDFRONT_DISTRIBUTION_DOMAIN} and #{S3_BUCKET_NAME} with actual
       values via AWS CodeBuild environment variables or CloudFormation substitution.
  -->
  <script src="https://#{CLOUDFRONT_DISTRIBUTION_DOMAIN}/assets/js/lodash-4.17.21.min.js"
          integrity="sha384-H6KKS1H1WwuERMSm+54dYLzjg0fKqRK5ZRyASdbrI/lwrCc6bXEmtGYr5SwvP1pZ"
          crossorigin="anonymous"
          nonce="__CSP_NONCE__"
          onerror="(function(s){s.onerror=null;s.src='https://#{S3_BUCKET_NAME}.s3.amazonaws.com/assets/js/lodash-4.17.21.min.js';})(this)"></script>
  <script nonce="__CSP_NONCE__">
    /* CDN fallback detection: if CloudFront-served lodash failed to load,
       reload from the S3 origin directly. */
    if (typeof _ === 'undefined') {
      var s = document.createElement('script');
      s.src = 'https://#{S3_BUCKET_NAME}.s3.amazonaws.com/assets/js/lodash-4.17.21.min.js';
      s.crossOrigin = 'anonymous';
      s.nonce = '__CSP_NONCE__';
      document.head.appendChild(s);
    }
  </script>
</head>
<body>
  <h1>Sign In</h1>
  <!--
    CLOUD REMEDIATION (cr-html-1004): AWS WAF with Domain Whitelist for Form Actions
    ─────────────────────────────────────────────────────────────────────────────────
    The original form action pointed directly to an external domain
    (https://external-vendor.example.com/submit), which risks data exfiltration
    and violates data-residency / privacy regulations in cloud environments.

    Remediation applied:
    1. The form action is now routed through a same-origin AWS API Gateway proxy
       endpoint (/api/proxy/submit).  The API Gateway integration forwards the
       request to the approved external vendor only after AWS WAF rules have
       validated the target domain against the approved whitelist.

    2. A client-side domain whitelist guard (ALLOWED_FORM_DOMAINS) is added as a
       defence-in-depth measure.  Before the form is submitted the JavaScript
       validateAndSubmit() function checks the resolved target domain against the
       whitelist and aborts submission if the domain is not approved.

    AWS WAF / API Gateway configuration required (infrastructure, out of scope here):
    - Create an AWS WAF Web ACL with a custom rule that inspects the
      "X-Target-Domain" request header forwarded by the proxy and blocks requests
      whose value is not in the approved domain whitelist
      (e.g., external-vendor.example.com).
    - Attach the Web ACL to the API Gateway stage that backs /api/proxy/submit.
    - The API Gateway Lambda/HTTP integration reads X-Target-Domain and proxies
      only to whitelisted origins, returning HTTP 403 for any other value.
  -->
  <form id="login-form" action="/api/proxy/submit" method="post" onsubmit="return validateAndSubmit(event)">
    <input name="user" type="text">
    <button type="button" id="login-btn">Login</button>
  </form>
  <script nonce="__CSP_NONCE__">
    /**
     * APPROVED domain whitelist for form submissions.
     * Only domains listed here are permitted as proxy targets.
     * This list is enforced both client-side (defence-in-depth) and
     * server-side via AWS WAF rules attached to the API Gateway stage.
     */
    var ALLOWED_FORM_DOMAINS = [
      'external-vendor.example.com'
    ];

    /**
     * Validates the resolved form-action domain against the approved whitelist
     * before allowing submission.  Submission is blocked and an error is logged
     * if the domain is not whitelisted, preventing data exfiltration to
     * untrusted external domains.
     *
     * cr-html-1009 Fix: All window and document API calls are guarded with
     * typeof checks to prevent failures in AWS Lambda@Edge and Amplify SSR
     * environments where browser APIs are unavailable during server-side rendering.
     *
     * @param {Event} event - The form submit event.
     * @returns {boolean} false to cancel native submission (fetch is used instead).
     */
    function validateAndSubmit(event) {
      if (event) {
        event.preventDefault();
      }

      // cr-html-1009 (Line 16): Guard document access with typeof check.
      // document is not available in AWS Lambda@Edge / Amplify SSR environments.
      if (typeof document === 'undefined') {
        return false;
      }

      var form = document.getElementById('login-form');
      var actionUrl = form.getAttribute('action');

      // Resolve the action URL to determine the target hostname.
      // cr-html-1009: Guard window.location.origin access with typeof check.
      // window is not available in AWS Lambda@Edge / Amplify SSR environments.
      var resolvedUrl;
      try {
        var baseOrigin = (typeof window !== 'undefined') ? window.location.origin : 'https://localhost';
        resolvedUrl = new URL(actionUrl, baseOrigin);
      } catch (e) {
        console.error('[Security] Invalid form action URL:', actionUrl);
        return false;
      }

      var targetDomain = resolvedUrl.hostname;

      // For same-origin proxy endpoints the hostname matches the current origin —
      // these are always permitted because AWS WAF enforces the downstream domain.
      // cr-html-1009: Guard window.location.hostname access with typeof check.
      var currentHostname = (typeof window !== 'undefined') ? window.location.hostname : '';
      var isSameOrigin = (targetDomain === currentHostname);

      if (!isSameOrigin && ALLOWED_FORM_DOMAINS.indexOf(targetDomain) === -1) {
        console.error(
          '[Security] Form submission blocked: domain "' + targetDomain +
          '" is not in the approved whitelist. ' +
          'AWS WAF domain whitelist enforcement is active.'
        );
        return false;
      }

      // Submit via fetch so the X-Target-Domain header can be forwarded to the
      // API Gateway proxy, which AWS WAF inspects against the domain whitelist.
      var formData = new FormData(form);
      fetch(actionUrl, {
        method: 'POST',
        headers: {
          'X-Target-Domain': 'external-vendor.example.com'
        },
        body: new URLSearchParams(formData)
      }).then(function(response) {
        if (!response.ok) {
          console.error('[Security] Proxy submission rejected by AWS WAF / API Gateway:', response.status);
        }
      }).catch(function(err) {
        console.error('[Security] Form submission error:', err);
      });

      return false; // Prevent native form navigation; fetch handles the request.
    }

    /**
     * cr-html-1009 Fix: Guard document.cookie access with typeof check.
     * document is not available in AWS Lambda@Edge / Amplify SSR environments.
     * The doLogin function sets a session cookie only when running in a browser context.
     */
    function doLogin() {
      if (typeof document !== 'undefined') {
        /*
         * cr-html-1005 Fix: Cookies Without Secure Flag in Cloud HTTPS
         * ─────────────────────────────────────────────────────────────
         * The Secure flag is now appended to the cookie string so the browser
         * only transmits this cookie over HTTPS connections.
         *
         * AWS CloudFront Lambda@Edge Enforcement (primary layer):
         * ─────────────────────────────────────────────────────────
         * A Lambda@Edge function attached to the CloudFront distribution's
         * "origin-response" (or "viewer-response") trigger intercepts every
         * Set-Cookie response header and automatically appends "; Secure" to
         * any cookie that does not already carry the flag.  This provides a
         * centralised, infrastructure-level guarantee that ALL cookies —
         * including those set by back-end services — are transmitted only over
         * HTTPS, regardless of whether the application code remembers to set
         * the flag explicitly.
         *
         * Lambda@Edge handler pattern (infrastructure — out of scope here):
         *   exports.handler = async (event) => {
         *     const response = event.Records[0].cf.response;
         *     const headers  = response.headers;
         *     if (headers['set-cookie']) {
         *       headers['set-cookie'] = headers['set-cookie'].map(c => {
         *         if (!/;\s*Secure/i.test(c.value)) {
         *           c.value += '; Secure';
         *         }
         *         return c;
         *       });
         *     }
         *     return response;
         *   };
         *
         * The CloudFront Cache Policy must be configured to forward cookies so
         * that the Lambda@Edge function can inspect and rewrite them correctly.
         */
        document.cookie = "session=abc123; path=/; Secure";
      }
    }
    var ready = true;

    // cr-html-1009 Fix: Guard document.getElementById access with typeof check.
    // document is not available in AWS Lambda@Edge / Amplify SSR environments.
    if (typeof document !== 'undefined') {
      document.getElementById('login-btn').addEventListener('click', doLogin);
    }
  </script>
</body>
</html>
