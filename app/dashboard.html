<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'nonce-{{CSP_NONCE}}'">
  <!--
    CLOUD MIGRATION NOTE (cr-html-1010 — Meta Refresh for Client-Side Navigation):
    The <meta http-equiv="refresh" content="0; url=/login"> tag has been removed.
    Client-side meta-refresh redirects break in cloud SSR environments (AWS CloudFront /
    Lambda@Edge) because the redirect fires in the browser after the full HTML payload
    has already been delivered, bypassing edge-level routing logic.

    Replacement: AWS CloudFront Function (viewer-request event) — HTTP 301/302 redirect
    ─────────────────────────────────────────────────────────────────────────────────────
    Associate the CloudFront Function below with the viewer-request event on the
    CloudFront distribution behaviour that matches the /dashboard path pattern.
    The function intercepts the request at the edge and returns a proper HTTP redirect
    response before any origin or cache lookup occurs.

    CloudFront Function source (JavaScript runtime 2.0):
    ┌─────────────────────────────────────────────────────────────────────────────┐
    │ function handler(event) {                                                   │
    │   var request = event.request;                                              │
    │   // Redirect unauthenticated /dashboard requests to /login at the edge    │
    │   if (request.uri === '/dashboard' || request.uri === '/dashboard/') {     │
    │     return {                                                                │
    │       statusCode: 302,                                                      │
    │       statusDescription: 'Found',                                          │
    │       headers: {                                                            │
    │         location: { value: '/login' },                                     │
    │         'cache-control': { value: 'no-store' }                             │
    │       }                                                                     │
    │     };                                                                      │
    │   }                                                                         │
    │   return request;                                                           │
    │ }                                                                           │
    └─────────────────────────────────────────────────────────────────────────────┘

    For authenticated-user redirect logic, evaluate the session cookie / JWT inside
    the CloudFront Function (or a Lambda@Edge viewer-request handler) and conditionally
    allow the request to pass through to the origin instead of redirecting.
  -->
  <title>Dashboard</title>
  <style>
    /* SSR Skeleton Screen styles for AWS CloudFront Lambda@Edge SSR */
    .ssr-skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: ssr-shimmer 1.5s infinite;
      border-radius: 4px;
    }
    @keyframes ssr-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .ssr-skeleton-header {
      height: 48px;
      width: 100%;
      margin-bottom: 16px;
    }
    .ssr-skeleton-card {
      height: 120px;
      width: 100%;
      margin-bottom: 12px;
      border-radius: 8px;
    }
    .ssr-skeleton-line {
      height: 16px;
      width: 80%;
      margin-bottom: 8px;
    }
    .ssr-skeleton-line-short {
      height: 16px;
      width: 50%;
      margin-bottom: 8px;
    }
    .ssr-loading-state {
      padding: 16px;
      width: 100%;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <!-- SSR skeleton screen placeholder for AWS CloudFront Lambda@Edge SSR: replaced by React/app hydration on client -->
  <div id="root">
    <div class="ssr-loading-state" aria-busy="true" aria-label="Loading application, please wait...">
      <div class="ssr-skeleton ssr-skeleton-header"></div>
      <div class="ssr-skeleton ssr-skeleton-card"></div>
      <div class="ssr-skeleton ssr-skeleton-line"></div>
      <div class="ssr-skeleton ssr-skeleton-line-short"></div>
      <div class="ssr-skeleton ssr-skeleton-card"></div>
    </div>
  </div>
  <!-- SSR skeleton screen placeholder for AWS CloudFront Lambda@Edge SSR: replaced by dynamic content on client -->
  <div id="content">
    <div class="ssr-loading-state" aria-busy="true" aria-label="Loading content, please wait...">
      <div class="ssr-skeleton ssr-skeleton-line"></div>
      <div class="ssr-skeleton ssr-skeleton-line-short"></div>
      <div class="ssr-skeleton ssr-skeleton-card"></div>
      <div class="ssr-skeleton ssr-skeleton-line"></div>
    </div>
  </div>
  <!-- suppressHydrationWarning: timestamp is rendered client-side only via useEffect to prevent SSR/hydration mismatch on AWS Lambda (Next.js) -->
  <span class="updated" id="last-updated" suppressHydrationWarning="true"></span>
  <script nonce="{{CSP_NONCE}}">
    // Client-side-only timestamp rendering (useEffect pattern) — avoids hydration mismatch
    // when deployed on AWS Lambda via Next.js/Remix SSR cloud platforms.
    (function() {
      function renderTimestamp() {
        var el = document.getElementById('last-updated');
        if (el) {
          var now = new Date();
          var formatted = now.getUTCFullYear() + '-' +
            String(now.getUTCMonth() + 1).padStart(2, '0') + '-' +
            String(now.getUTCDate()).padStart(2, '0') + ' ' +
            String(now.getUTCHours()).padStart(2, '0') + ':' +
            String(now.getUTCMinutes()).padStart(2, '0') + ':' +
            String(now.getUTCSeconds()).padStart(2, '0') + ' UTC';
          el.textContent = 'Last updated: ' + formatted;
        }
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', renderTimestamp);
      } else {
        renderTimestamp();
      }
    })();
    window.localStorage.getItem('token');
    document.getElementById('root').innerHTML = 'loading';
  </script>
</body>
</html>
