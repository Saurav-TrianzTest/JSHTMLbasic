<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'nonce-{{CSP_NONCE}}'">
  <title>Dashboard</title>
  <link rel="stylesheet" href="skeleton.css">
</head>
<body>
  <div id="root" aria-busy="true" aria-live="polite" data-ssr-placeholder="true">
    <span class="skeleton-line" role="presentation"></span>
    <span class="skeleton-line short" role="presentation"></span>
    <noscript>Loading dashboard&hellip;</noscript>
  </div>
  <div id="content" aria-busy="true" aria-live="polite" data-ssr-placeholder="true">
    <span class="skeleton-line" role="presentation"></span>
    <span class="skeleton-line" role="presentation"></span>
    <span class="skeleton-line short" role="presentation"></span>
  </div>
  <span class="updated">Last updated: 2026-06-17 09:30:00 UTC</span>
  <script nonce="{{CSP_NONCE}}">
    window.localStorage.getItem('token');
    document.getElementById('root').innerHTML = 'loading';
  </script>
</body>
</html>
