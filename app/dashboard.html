<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'nonce-{{CSP_NONCE}}'">
  <!-- Redirect to /login is handled server-side via GCP Cloud Load Balancing URL map
       with an HTTP 301 redirect action — meta refresh removed for cloud SSR compatibility. -->
  <title>Dashboard</title>
</head>
<body>
  <!-- SSR skeleton placeholder for GCP Cloud Run initial render -->
  <div id="root" aria-busy="true" aria-label="Loading application">
    <div class="skeleton-screen" role="status">
      <div class="skeleton-header">
        <div class="skeleton-block skeleton-title"></div>
        <div class="skeleton-block skeleton-subtitle"></div>
      </div>
      <div class="skeleton-body">
        <div class="skeleton-block skeleton-line"></div>
        <div class="skeleton-block skeleton-line skeleton-line--short"></div>
        <div class="skeleton-block skeleton-line"></div>
      </div>
    </div>
  </div>
  <!-- SSR skeleton placeholder for GCP Cloud Run initial render -->
  <div id="content" aria-busy="true" aria-label="Loading content">
    <div class="skeleton-screen" role="status">
      <div class="skeleton-card">
        <div class="skeleton-block skeleton-card__image"></div>
        <div class="skeleton-card__body">
          <div class="skeleton-block skeleton-line"></div>
          <div class="skeleton-block skeleton-line skeleton-line--short"></div>
        </div>
      </div>
      <div class="skeleton-card">
        <div class="skeleton-block skeleton-card__image"></div>
        <div class="skeleton-card__body">
          <div class="skeleton-block skeleton-line"></div>
          <div class="skeleton-block skeleton-line skeleton-line--short"></div>
        </div>
      </div>
    </div>
  </div>
  <span class="updated">Last updated: 2026-06-17 09:30:00 UTC</span>
  <script nonce="{{CSP_NONCE}}">
    window.localStorage.getItem('token');
    document.getElementById('root').innerHTML = 'loading';
  </script>
</body>
</html>
