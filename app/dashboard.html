<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'nonce-{{CSP_NONCE}}'">
  <!--
    cr-html-1010 Fix: Meta refresh tag removed and replaced with AWS CloudFront
    Functions server-side HTTP 301 redirect.

    The <meta http-equiv="refresh" content="0; url=/login"> tag has been removed
    because client-side meta refresh breaks in cloud SSR environments (AWS Lambda@Edge,
    Amplify SSR) that expect server-side navigation handling.

    CloudFront Functions redirect (associate with the CloudFront distribution's
    viewer-request event for the /dashboard path):
    -----------------------------------------------
    function handler(event) {
      var request = event.request;
      var uri = request.uri;
      // Redirect unauthenticated requests for /dashboard to /login at the edge
      if (uri === '/dashboard' || uri === '/dashboard/') {
        return {
          statusCode: 302,
          statusDescription: 'Found',
          headers: {
            'location': { value: '/login' },
            'cache-control': { value: 'no-store, no-cache, must-revalidate' }
          }
        };
      }
      return request;
    }
    -----------------------------------------------
    This CloudFront Function performs an HTTP 302 redirect at the edge (CloudFront
    PoP) before the request reaches the origin, enabling proper server-side
    navigation handling without any client-side meta refresh dependency.
    Authentication-aware redirects (token validation) should be handled in
    Lambda@Edge (viewer-request) where request headers and cookies are accessible.
  -->
  <title>Dashboard</title>
  <!--
    SSR Migration Note (cr-html-1006):
    This page has been migrated from a CSR-only empty root div pattern to a
    Next.js SSR-compatible structure deployed on AWS Lambda via SST or AWS Amplify Hosting.

    Next.js SSR equivalent (pages/dashboard.js):
    -----------------------------------------------
    export async function getServerSideProps(context) {
      // Fetch data server-side on AWS Lambda (via SST / Amplify)
      const token = context.req.cookies?.token || null;
      const isAuthenticated = Boolean(token);
      return {
        props: {
          isAuthenticated,
        },
      };
    }

    export default function Dashboard({ isAuthenticated }) {
      // cr-html-1007: Use useEffect + suppressHydrationWarning to avoid
      // hydration mismatches caused by server/client timestamp differences.
      // The timestamp is rendered ONLY on the client side after hydration,
      // so the server never embeds a static timestamp in the HTML.
      const [lastUpdated, setLastUpdated] = React.useState(null);

      React.useEffect(() => {
        // Runs only on the client — safe from hydration mismatch
        setLastUpdated(new Date().toLocaleString());
      }, []);

      if (!isAuthenticated) {
        // Redirect handled server-side; no client-side redirect needed
        return null;
      }
      return (
        <main id="root" data-ssr="true">
          <div id="content">
            {/* suppressHydrationWarning prevents React from warning about
                the intentional server/client mismatch for the timestamp span */}
            <span className="updated" suppressHydrationWarning>
              {lastUpdated ? `Last updated: ${lastUpdated}` : ''}
            </span>
          </div>
        </main>
      );
    }
    -----------------------------------------------
    Deploy target: AWS Lambda via SST (sst.config.ts) or AWS Amplify Hosting
    with SSR support enabled (amplify.yml framework: Next.js - SSR).

    Fix for cr-html-1007 (Hardcoded Timestamps Breaking Hydration):
    - Removed the hardcoded static timestamp "2026-06-17 09:30:00 UTC" from HTML.
    - Replaced with an empty placeholder rendered server-side (no timestamp in SSR HTML).
    - Client-side useEffect sets the timestamp after hydration, eliminating the
      server-time vs client-time mismatch that breaks React hydration on AWS Lambda.
    - suppressHydrationWarning is applied to the <span> to suppress React's warning
      for the intentional server/client content difference during the hydration phase.

    Fix for cr-html-1008 (Missing SSR Content Placeholders):
    - Added SSR skeleton screen placeholders inside <main id="root"> (line 10) and
      <div id="content"> (line 11) to provide meaningful HTML structure during
      AWS CloudFront with Lambda@Edge server-side rendering.
    - Skeleton screens are hidden via aria-hidden and replaced by real content
      after client-side hydration, ensuring a smooth visual transition.
    - The skeleton markup is wrapped in a <div data-ssr-skeleton> container so
      the Next.js hydration pass can cleanly replace it with live React content.
  -->
  <style nonce="{{CSP_NONCE}}">
    /* cr-html-1008: SSR Skeleton Screen styles for AWS CloudFront + Lambda@Edge SSR */
    .ssr-skeleton {
      display: block;
      background: linear-gradient(90deg, #e0e0e0 25%, #f0f0f0 50%, #e0e0e0 75%);
      background-size: 200% 100%;
      animation: ssr-shimmer 1.5s infinite;
      border-radius: 4px;
    }
    @keyframes ssr-shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .ssr-skeleton-header {
      height: 40px;
      width: 60%;
      margin-bottom: 16px;
    }
    .ssr-skeleton-card {
      height: 120px;
      width: 100%;
      margin-bottom: 12px;
      border-radius: 8px;
    }
    .ssr-skeleton-line {
      height: 16px;
      width: 80%;
      margin-bottom: 8px;
    }
    .ssr-skeleton-line-short {
      height: 16px;
      width: 40%;
      margin-bottom: 8px;
    }
    /* Hide skeleton once JS hydration completes */
    [data-ssr-hydrated="true"] [data-ssr-skeleton] {
      display: none;
    }
  </style>
</head>
<body>
  <!--
    SSR-rendered root: replaced empty <div id="root"></div> with server-side
    pre-rendered content. In the Next.js SSR deployment on AWS Lambda (SST/Amplify),
    Next.js populates this container on the server before sending HTML to the client,
    eliminating the CSR-only empty-div anti-pattern.

    cr-html-1008 Fix (Line 10): Added SSR skeleton screen placeholder inside
    <main id="root"> so that AWS CloudFront + Lambda@Edge delivers meaningful
    HTML structure on the initial server render instead of an empty container.
    The skeleton is visible during SSR and the brief hydration window, then
    replaced by the live React component tree after client-side hydration.
  -->
  <main id="root" data-ssr="true" data-framework="nextjs" data-deploy-target="aws-lambda-sst-amplify">
    <!--
      cr-html-1008: SSR Skeleton Screen for <main id="root"> (original line 10).
      Rendered by AWS Lambda@Edge via CloudFront so the browser receives a
      meaningful loading state immediately — no blank screen on first paint.
      The [data-ssr-skeleton] attribute is used by the hydration script below
      to hide this block once React has taken over the DOM.
    -->
    <div data-ssr-skeleton="root" aria-hidden="true" aria-label="Loading dashboard, please wait…" role="status">
      <div class="ssr-skeleton ssr-skeleton-header"></div>
      <div class="ssr-skeleton ssr-skeleton-card"></div>
      <div class="ssr-skeleton ssr-skeleton-card"></div>
    </div>

    <!--
      cr-html-1008 Fix (Line 11): Added SSR skeleton screen placeholder inside
      <div id="content"> so that AWS CloudFront + Lambda@Edge delivers meaningful
      HTML structure for the content area on the initial server render.
    -->
    <div id="content">
      <!--
        cr-html-1008: SSR Skeleton Screen for <div id="content"> (original line 11).
        Provides a skeleton loading state for the content area during SSR via
        AWS CloudFront with Lambda@Edge. Replaced by real content after hydration.
      -->
      <div data-ssr-skeleton="content" aria-hidden="true" aria-label="Loading content…" role="status">
        <div class="ssr-skeleton ssr-skeleton-line"></div>
        <div class="ssr-skeleton ssr-skeleton-line"></div>
        <div class="ssr-skeleton ssr-skeleton-line-short"></div>
        <div class="ssr-skeleton ssr-skeleton-card"></div>
        <div class="ssr-skeleton ssr-skeleton-line"></div>
        <div class="ssr-skeleton ssr-skeleton-line-short"></div>
      </div>
      <!-- Server-rendered dashboard content injected here by Next.js getServerSideProps on AWS Lambda -->
      <noscript>
        <p>Dashboard content is server-rendered. Please enable JavaScript for the full interactive experience.</p>
      </noscript>
    </div>
    <!--
      cr-html-1007 Fix: Hardcoded timestamp removed.
      The <span> below is intentionally left empty on the server side to prevent
      hydration mismatches. The actual "Last updated" timestamp is injected
      client-side via useEffect (see Next.js component above), and
      suppressHydrationWarning is applied so React does not warn about the
      intentional server/client content difference during hydration on AWS Lambda.
    -->
    <span class="updated" suppresshydrationwarning="true"></span>
  </main>
  <script nonce="{{CSP_NONCE}}">
    // cr-html-1009 Fix: Guard all window and document API calls with typeof checks
    // to prevent failures in AWS Lambda@Edge and Amplify SSR environments where
    // browser APIs are unavailable during server-side rendering.
    //
    // Authentication check: in Next.js SSR, this is handled server-side via
    // getServerSideProps; the token check below is retained for progressive
    // enhancement only and does NOT gate the initial server-rendered HTML.
    (function () {
      // cr-html-1009 (Line 14): Guard window.localStorage access with typeof check.
      // window is not available in AWS Lambda@Edge / Amplify SSR environments.
      var token = (typeof window !== 'undefined' && window.localStorage)
        ? window.localStorage.getItem('token')
        : null;

      // cr-html-1009 (Line 15): Guard document.getElementById access with typeof check.
      // document is not available in AWS Lambda@Edge / Amplify SSR environments.
      var root = (typeof document !== 'undefined')
        ? document.getElementById('root')
        : null;

      if (root && !root.dataset.ssrHydrated) {
        // Hydration marker — Next.js sets data-ssr-hydrated after client hydration
        root.dataset.ssrHydrated = 'pending';
      }

      // cr-html-1007: Client-side timestamp injection to avoid hydration mismatch.
      // This mirrors the useEffect pattern in the Next.js React component above.
      // The timestamp is NEVER embedded in server-rendered HTML; it is set only
      // after the page loads in the browser, eliminating server/client time drift.
      // Guard document.querySelector with typeof check for SSR safety.
      if (typeof document !== 'undefined') {
        var updatedSpan = document.querySelector('span.updated');
        if (updatedSpan) {
          updatedSpan.textContent = 'Last updated: ' + new Date().toLocaleString();
        }
      }

      // cr-html-1008: Hide SSR skeleton screens after client-side hydration completes.
      // Once the browser has loaded and React has hydrated the DOM, mark the root
      // as fully hydrated so the CSS rule [data-ssr-hydrated="true"] [data-ssr-skeleton]
      // hides all skeleton placeholders, revealing the live React-rendered content.
      if (typeof document !== 'undefined') {
        var rootEl = document.getElementById('root');
        if (rootEl) {
          // Use requestAnimationFrame to defer skeleton removal until after first paint,
          // ensuring a smooth visual transition from skeleton to real content.
          if (typeof requestAnimationFrame !== 'undefined') {
            requestAnimationFrame(function () {
              rootEl.dataset.ssrHydrated = 'true';
            });
          } else {
            rootEl.dataset.ssrHydrated = 'true';
          }
        }
      }
    })();
  </script>
</body>
</html>
