<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'nonce-{{CSP_NONCE}}'">
  <title>Dashboard</title>
  <!--
    SSR Migration Note:
    This page has been migrated from a CSR-only pattern (empty <div id="root">)
    to a Next.js server-side rendering (SSR) pattern deployed on AWS Lambda
    via SST (Serverless Stack) or AWS Amplify Hosting.

    Next.js SSR entry point: pages/dashboard.js (or app/dashboard/page.js for App Router)
    AWS deployment: SST (sst.config.ts) or AWS Amplify (amplify.yml)

    The empty root div has been replaced with server-rendered semantic HTML.
    Next.js will hydrate this content on the client after SSR delivers the
    pre-rendered markup, enabling SEO indexing and improved performance on
    AWS Lambda@Edge / CloudFront.
  -->
</head>
<body>
  <!-- SSR: Server-rendered dashboard shell (replaces CSR-only empty root div) -->
  <div id="root" data-ssr="true" data-next-page="dashboard">
    <!-- Next.js SSR: Pre-rendered dashboard content served from AWS Lambda -->
    <main id="dashboard-main" role="main" aria-label="Dashboard">
      <header class="dashboard-header">
        <h1>Dashboard</h1>
      </header>
      <section id="dashboard-content" class="dashboard-content">
        <!-- Server-rendered content placeholder; Next.js SSR populates this
             via getServerSideProps() before sending HTML to the client.
             AWS Lambda (via SST/Amplify) executes the Next.js render function
             on each request, ensuring fresh, SEO-indexable HTML. -->
        <p class="ssr-loading-indicator">Loading dashboard data&hellip;</p>
      </section>
    </main>
  </div>
  <div id="content"></div>
  <!--
    Cloud SSR Fix (cr-html-1007): Hardcoded timestamp replaced with client-side rendering.
    The suppressHydrationWarning attribute prevents React hydration mismatches on AWS Lambda
    (Next.js SSR). The actual timestamp is injected client-side via a useEffect-equivalent
    DOMContentLoaded handler, ensuring the server-rendered HTML never contains a stale or
    mismatched timestamp value.
  -->
  <span
    id="last-updated-timestamp"
    class="updated"
    suppresshydrationwarning="true"
    data-suppress-hydration-warning="true"
    aria-live="polite"
  ><!-- timestamp rendered client-side --></span>
  <script nonce="{{CSP_NONCE}}">
    // SSR hydration: token is read after server-rendered HTML is delivered.
    // In Next.js, authentication state is managed server-side via
    // getServerSideProps() or middleware, avoiding CSR-only localStorage checks.
    if (typeof window !== 'undefined') {
      window.localStorage.getItem('token');
    }
    // Next.js SSR hydration replaces the loading indicator with real content.
    var rootEl = document.getElementById('root');
    if (rootEl && rootEl.getAttribute('data-ssr') === 'true') {
      // Content is already server-rendered; client hydration will take over.
      var loadingEl = rootEl.querySelector('.ssr-loading-indicator');
      if (loadingEl) { loadingEl.textContent = 'loading'; }
    }
  </script>
  <script nonce="{{CSP_NONCE}}">
    /**
     * Cloud SSR Fix: cr-html-1007 — Hardcoded Timestamps Breaking Hydration
     *
     * Replaces the previously hardcoded server timestamp with a client-side
     * rendered value, mirroring React's suppressHydrationWarning + useEffect
     * pattern for AWS Lambda / Next.js SSR deployments.
     *
     * React equivalent:
     *   const [timestamp, setTimestamp] = React.useState(null);
     *   React.useEffect(() => { setTimestamp(new Date().toUTCString()); }, []);
     *   return <span suppressHydrationWarning>{timestamp}</span>;
     */
    (function renderClientTimestamp() {
      function pad(n) { return n < 10 ? '0' + n : String(n); }
      function formatUTC(d) {
        return d.getUTCFullYear() + '-' +
               pad(d.getUTCMonth() + 1) + '-' +
               pad(d.getUTCDate()) + ' ' +
               pad(d.getUTCHours()) + ':' +
               pad(d.getUTCMinutes()) + ':' +
               pad(d.getUTCSeconds()) + ' UTC';
      }
      function setTimestamp() {
        var el = document.getElementById('last-updated-timestamp');
        if (el) {
          // Client-side only: never present in server-rendered HTML,
          // preventing hydration mismatches on AWS Lambda (Next.js SSR).
          el.textContent = 'Last updated: ' + formatUTC(new Date());
        }
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', setTimestamp);
      } else {
        setTimestamp();
      }
    })();
  </script>
</body>
</html>
