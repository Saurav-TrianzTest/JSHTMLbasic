<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!--
    AWS CloudFront HTTPS Enforcement — Mixed Content Auto-Upgrade (cr-html-1017)
    ─────────────────────────────────────────────────────────────────────────────
    The Content-Security-Policy header below enforces HTTPS-only resource loading:
      • upgrade-insecure-requests: instructs the browser to automatically upgrade
        any remaining HTTP sub-resource requests to HTTPS before fetching.
      • block-all-mixed-content: blocks any mixed HTTP content that cannot be upgraded.
      • All style-src and script-src origins are restricted to HTTPS endpoints only.
        The previous http://assets.example.com origin has been removed; all static
        assets are now served exclusively via the AWS CloudFront HTTPS distribution.
    For Lambda@Edge enforcement, deploy the CloudFront-CSP-Headers function that
    injects these headers at the CDN edge for every response.
  -->
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests; block-all-mixed-content; default-src 'self'; script-src 'self' https://www.google-analytics.com https://#{CLOUDFRONT_DISTRIBUTION_DOMAIN} https://#{S3_BUCKET_NAME}.s3.amazonaws.com; style-src 'self' https://#{CLOUDFRONT_DISTRIBUTION_DOMAIN} https://#{S3_BUCKET_NAME}.s3.amazonaws.com">
  <!-- Build-time values below are injected by AWS CodeBuild via environment variables sourced from AWS Secrets Manager / Parameter Store.
       Template tokens use the #{VAR_NAME} syntax resolved by the AWS CodeBuild 'sed' or 'envsubst' build phase command,
       or via a CloudFormation/CDK parameter substitution step (e.g., aws cloudformation deploy --parameter-overrides).
       DO NOT replace these tokens with hardcoded values. -->
  <meta name="api-key" content="#{API_KEY}">
  <!-- Preconnect to AWS Cognito authentication endpoints for early connection setup -->
  <link rel="preconnect" href="https://cognito-idp.us-east-1.amazonaws.com" crossorigin>
  <link rel="dns-prefetch" href="https://cognito-idp.us-east-1.amazonaws.com">
  <!-- Preconnect to AWS CloudFront CDN distribution for reduced latency -->
  <link rel="preconnect" href="https://#{CLOUDFRONT_DISTRIBUTION_DOMAIN}" crossorigin>
  <link rel="dns-prefetch" href="https://#{CLOUDFRONT_DISTRIBUTION_DOMAIN}">
  <!-- Preconnect to Google Analytics for early connection establishment -->
  <link rel="preconnect" href="https://www.google-analytics.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.google-analytics.com">
  <meta name="build-version" content="#{BUILD_VERSION}">
  <!--
    CDN Fallback Strategy: AWS S3 + CloudFront (cr-html-1014)
    ──────────────────────────────────────────────────────────
    theme.css is served primarily via the AWS CloudFront distribution (S3 origin).
    If CloudFront is unavailable the onerror handler falls back to the S3 origin URL.

    Setup required:
    1. Upload theme.css to S3: s3://#{S3_BUCKET_NAME}/assets/css/theme.css
    2. Create/update the CloudFront distribution with the S3 bucket as origin.
    3. Replace #{CLOUDFRONT_DISTRIBUTION_DOMAIN} and #{S3_BUCKET_NAME} with actual
       values via AWS CodeBuild environment variables or CloudFormation substitution.
  -->
  <link rel="stylesheet"
        href="https://#{CLOUDFRONT_DISTRIBUTION_DOMAIN}/assets/css/theme.css"
        onerror="this.onerror=null;this.href='https://#{S3_BUCKET_NAME}.s3.amazonaws.com/assets/css/theme.css'">
  <title>Deploy Config</title>
  <!--
    CDN Fallback Strategy: AWS S3 + CloudFront (cr-html-1014)
    ──────────────────────────────────────────────────────────
    Primary:  AWS CloudFront distribution serving analytics.js from S3 origin.
    Fallback: Direct S3 origin URL if CloudFront is unavailable.
    The inline script below detects CDN load failure and falls back to the S3 origin.

    SRI Note: analytics.js is dynamically updated by Google and its content changes frequently.
    Per AWS CloudFront integration strategy, this script should be proxied through a CloudFront
    distribution with origin set to www.google-analytics.com, enabling cache-control and
    integrity verification at the CDN layer. The SRI hash below reflects the version at
    build time and must be refreshed via your CI/CD pipeline (AWS CodeBuild) when the file changes.

    Setup required:
    1. Upload analytics.js to S3: s3://#{S3_BUCKET_NAME}/assets/js/analytics.js
    2. Create/update the CloudFront distribution with the S3 bucket as origin.
    3. Replace #{CLOUDFRONT_DISTRIBUTION_DOMAIN} and #{S3_BUCKET_NAME} with actual
       values via AWS CodeBuild environment variables or CloudFormation substitution.
  -->
  <script src="https://#{CLOUDFRONT_DISTRIBUTION_DOMAIN}/assets/js/analytics.js"
          integrity="sha384-9hMAdN+G12FuXKNyYYazvfsLGBksEhvfayjgq21CZBrU5Qc66QD2vQ2H7GCsqTcp"
          crossorigin="anonymous"
          onerror="(function(s){s.onerror=null;s.src='https://#{S3_BUCKET_NAME}.s3.amazonaws.com/assets/js/analytics.js';})(this)"></script>
  <script>
    /* CDN fallback detection: if CloudFront-served analytics script failed to
       define the expected global (window.ga), reload from the S3 origin directly. */
    (function() {
      if (typeof window !== 'undefined' && typeof window.ga === 'undefined') {
        var s = document.createElement('script');
        s.src = 'https://#{S3_BUCKET_NAME}.s3.amazonaws.com/assets/js/analytics.js';
        s.crossOrigin = 'anonymous';
        document.head.appendChild(s);
      }
    })();
  </script>
</head>
<body>
  <h1>Settings</h1>
  <img src="images/icons/gear.png" alt="settings">
</body>
</html>
