<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://widgets.example.com 'nonce-{{CSP_NONCE}}'">
  <link rel="preconnect" href="https://api.skyline.cloud">
  <!-- DNS prefetch hints for AWS API Gateway, CloudFront, and S3 domains -->
  <link rel="dns-prefetch" href="//execute-api.us-east-1.amazonaws.com">
  <link rel="dns-prefetch" href="//{{API_GATEWAY_ID}}.execute-api.{{AWS_REGION}}.amazonaws.com">
  <link rel="dns-prefetch" href="//{{CLOUDFRONT_DISTRIBUTION_DOMAIN}}">
  <link rel="dns-prefetch" href="//cloudfront.net">
  <link rel="dns-prefetch" href="//{{S3_BUCKET_NAME}}.s3.{{AWS_REGION}}.amazonaws.com">
  <link rel="dns-prefetch" href="//s3.amazonaws.com">
  <title>Reports</title>
  <!--
    cr-html-1014: CDN resource loaded with AWS S3 + CloudFront fallback.
    Primary: widgets.example.com CDN. Fallback: CloudFront/S3 origin if CDN is unavailable.
    Asset must be uploaded to S3 bucket and served via CloudFront distribution.
  -->
  <script src="https://widgets.example.com/chart-widget.js"
          integrity="sha384-aaaabbbbccccddddeeeeffffgggghhhhiiiijjjjkkkkllllmmmmnnnnooooppppqqqq"
          crossorigin="anonymous"
          onerror="this.onerror=null;this.src='https://{{CLOUDFRONT_DISTRIBUTION_DOMAIN}}/vendor/chart-widget.js';"></script>
  <script>
    // cr-html-1014: Fallback detection — if CDN script failed to define expected global, load from S3/CloudFront origin.
    if (typeof ChartWidget === 'undefined') {
      document.write('<script src="https://{{CLOUDFRONT_DISTRIBUTION_DOMAIN}}/vendor/chart-widget.js"><\/script>');
    }
  </script>
</head>
<body>
  <h1>Reports</h1>
  <!-- cr-html-1011: Large inline base64 image extracted to Amazon S3 and served via CloudFront CDN. -->
  <!-- The original base64-encoded PNG (>10KB) has been decoded, uploaded to S3 bucket, and the src replaced with a CloudFront distribution URL. -->
  <img alt="chart" src="https://{{CLOUDFRONT_DISTRIBUTION_DOMAIN}}/assets/images/chart.png">
  <script nonce="{{CSP_NONCE}}">
    fetch('https://api.skyline.cloud/v1/reports').then(function(r){ return r.json(); });
  </script>
</body>
</html>
