<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://widgets.example.com 'nonce-{{CSP_NONCE}}'">
  <link rel="preconnect" href="https://api.skyline.cloud">
  <title>Reports</title>
  <script src="https://widgets.example.com/chart-widget.js" integrity="sha384-aaaabbbbccccddddeeeeffffgggghhhhiiiijjjjkkkkllllmmmmnnnnooooppppqqqq" crossorigin="anonymous"></script>
</head>
<body>
  <h1>Reports</h1>
  <!-- NOTE: Image previously inlined as a large base64 data URI (>10KB) has been extracted to Amazon S3
       and is now served via CloudFront CDN for optimal edge caching and delivery performance.
       Upload the decoded image binary to: s3://${ASSETS_S3_BUCKET}/assets/images/chart.png
       and ensure the CloudFront distribution (CLOUDFRONT_DOMAIN) points to that S3 bucket. -->
  <img alt="chart" src="https://${CLOUDFRONT_DOMAIN}/assets/images/chart.png">
  <script nonce="{{CSP_NONCE}}">
    fetch('https://api.skyline.cloud/v1/reports').then(function(r){ return r.json(); });
  </script>
</body>
</html>
