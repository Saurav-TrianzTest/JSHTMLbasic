<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://widgets.example.com 'nonce-{{CSP_NONCE}}'">
  <link rel="preconnect" href="https://api.skyline.cloud">
  <title>Reports</title>
  <!--
    CDN resource hosted on Azure Blob Storage and served via Azure CDN (primary).
    onerror fallback loads the same asset from the Azure Blob Storage origin directly
    if the Azure CDN edge is unavailable, ensuring resilience in cloud deployments.
    Rule: cr-html-1014 — CDN Resources Without Fallback URLs
  -->
  <script src="https://{{AZURE_CDN_ENDPOINT}}.azureedge.net/vendor/chart-widget.js"
          integrity="sha384-aaaabbbbccccddddeeeeffffgggghhhhiiiijjjjkkkkllllmmmmnnnnooooppppqqqq"
          crossorigin="anonymous"
          onerror="this.onerror=null;this.src='https://{{AZURE_STORAGE_ACCOUNT}}.blob.core.windows.net/vendor/chart-widget.js';"></script>
</head>
<body>
  <h1>Reports</h1>
  <!-- Image asset extracted from inline base64 and uploaded to Azure Blob Storage; served via Azure CDN for optimal edge caching and delivery. -->
  <img alt="chart" src="https://{{AZURE_CDN_ENDPOINT}}.azureedge.net/assets/images/chart.png">
  <script nonce="{{CSP_NONCE}}">
    fetch('https://api.skyline.cloud/v1/reports').then(function(r){ return r.json(); });
  </script>
</body>
</html>
