<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://widgets.example.com https://{{CLOUDFRONT_DISTRIBUTION_DOMAIN}} 'nonce-{{CSP_NONCE}}'">
  <link rel="preconnect" href="https://api.skyline.cloud">
  <title>Reports</title>
  <!--
    CLOUD READINESS FIX (cr-html-1014): CDN resource now served via AWS CloudFront
    with an S3 origin fallback. The primary script is loaded from the CloudFront
    distribution. An inline fallback script detects load failure and re-fetches
    the asset directly from the S3 origin bucket, ensuring resilience when the
    CDN edge is unavailable.
  -->
  <script src="https://{{CLOUDFRONT_DISTRIBUTION_DOMAIN}}/assets/js/chart-widget.js"
          integrity="sha384-aaaabbbbccccddddeeeeffffgggghhhhiiiijjjjkkkkllllmmmmnnnnooooppppqqqq"
          crossorigin="anonymous"
          onerror="this.onerror=null;this.src='https://{{S3_ORIGIN_BUCKET}}.s3.amazonaws.com/assets/js/chart-widget.js';"></script>
  <script nonce="{{CSP_NONCE}}">
    // Fallback detection: if the CloudFront-served script did not define the
    // expected global, reload it directly from the S3 origin bucket.
    (function() {
      var scripts = document.querySelectorAll('script[src*="chart-widget.js"]');
      var loaded = false;
      for (var i = 0; i < scripts.length; i++) {
        if (scripts[i].src && !scripts[i].src.includes('s3.amazonaws.com')) {
          // Primary CDN script — check if it loaded successfully via onerror above
          loaded = true;
        }
      }
      // If window.ChartWidget is not defined after CDN load, fall back to S3 origin
      if (typeof window.ChartWidget === 'undefined') {
        var fallback = document.createElement('script');
        fallback.src = 'https://{{S3_ORIGIN_BUCKET}}.s3.amazonaws.com/assets/js/chart-widget.js';
        fallback.crossOrigin = 'anonymous';
        document.head.appendChild(fallback);
      }
    })();
  </script>
</head>
<body>
  <h1>Reports</h1>
  <!-- Image extracted from inline base64 and uploaded to Amazon S3; served via CloudFront CDN (cr-html-1011) -->
  <img alt="chart" src="https://{{CLOUDFRONT_DISTRIBUTION_DOMAIN}}/assets/images/chart.png">
  <script nonce="{{CSP_NONCE}}">
    fetch('https://api.skyline.cloud/v1/reports').then(function(r){ return r.json(); });
  </script>
</body>
</html>
