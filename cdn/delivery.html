<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://widgets.example.com 'nonce-{{CSP_NONCE}}'">
  <link rel="preconnect" href="https://api.skyline.cloud">
  <title>Reports</title>
  <!-- cr-html-1014: Primary CDN source served via GCP Cloud Storage + Cloud CDN; onerror fallback to self-hosted asset -->
  <script src="https://storage.googleapis.com/YOUR_GCS_BUCKET/assets/js/chart-widget.js"
          integrity="sha384-aaaabbbbccccddddeeeeffffgggghhhhiiiijjjjkkkkllllmmmmnnnnooooppppqqqq"
          crossorigin="anonymous"
          onerror="this.onerror=null;this.src='/assets/js/chart-widget.js';"></script>
</head>
<body>
  <h1>Reports</h1>
  <!-- cr-html-1011: Large inline base64 image extracted to Google Cloud Storage and served via Cloud CDN. -->
  <!-- The original data:image/png;base64 URI (>10KB) has been replaced with a Cloud CDN URL. -->
  <!-- Upload the decoded image binary to your GCS bucket and enable Cloud CDN on the backend bucket. -->
  <img alt="chart" src="https://cdn.example.com/assets/images/chart.png">
  <script nonce="{{CSP_NONCE}}">
    fetch('https://api.skyline.cloud/v1/reports').then(function(r){ return r.json(); });
  </script>
</body>
</html>
